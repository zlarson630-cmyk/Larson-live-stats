<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:transparent;font:700 25px system-ui;color:#fff}#bug{position:absolute;bottom:35px;left:35px;display:flex;border-radius:8px;overflow:hidden;background:#14243ee8}span{padding:12px 18px;border-right:1px solid #718096}#clock{background:#a52a40}</style></head><body><div id="bug"><span id="away">VISITOR</span><span id="as">0</span><span id="clock">Q1 8:00</span><span id="hs">0</span><span id="home">HOME</span></div><div id="status" style="position:absolute;bottom:5px;left:35px;font:12px system-ui;color:#fbbf24" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script><script src="live.js"></script><script>
const params=new URLSearchParams(location.search),id=(params.get('game')||'').trim().toUpperCase();
let state=null;
const status=document.getElementById('status');
function draw(){if(!state)return;const s=state;for(const t of ['home','away'])document.getElementById(t).textContent=s[t];document.getElementById('as').textContent=s.scores.away;document.getElementById('hs').textContent=s.scores.home;const n=s.running?Math.max(0,s.seconds-Math.floor((Date.now()-s.startedAt)/1000)):s.seconds;document.getElementById('clock').textContent='Q'+s.period+' '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
if(!/^[A-Z0-9]{6}$/.test(id)){status.textContent='Provide a valid ?game=ABC123';document.getElementById('bug').style.display='none';}
else if(params.get('local')==='1'){
 const reload=()=>{try{state=JSON.parse(localStorage.getItem('lls-game-'+id));status.textContent=state?'Local only · same browser':'Local game not found';draw();}catch(e){status.textContent='Local game unavailable';}};
 window.addEventListener('storage',reload);setInterval(reload,1000);reload();
}else{
 status.textContent='Connecting…';Live.watch(id,row=>{if(row){state=Live.publicState(row);draw();}},message=>{status.textContent=message.startsWith('Live')?'':message;});
}
setInterval(draw,250);
</script></body></html>
