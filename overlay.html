<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:transparent;font:700 25px system-ui;color:#fff}#bug{position:absolute;bottom:35px;left:35px;display:flex;border-radius:8px;overflow:hidden;background:#14243ee8}span{padding:12px 18px;border-right:1px solid #718096}#clock{background:#a52a40}</style></head><body><div id="bug"><span id="away">VISITOR</span><span id="as">0</span><span id="clock">Q1 8:00</span><span id="hs">0</span><span id="home">HOME</span></div><script>const id=new URLSearchParams(location.search).get('game');function draw(){try{const s=JSON.parse(localStorage.getItem('lls-game-'+id));if(!s)return;for(const t of ['home','away'])document.getElementById(t).textContent=s[t];document.getElementById('as').textContent=s.scores.away;document.getElementById('hs').textContent=s.scores.home;let n=s.running?Math.max(0,s.seconds-Math.floor((Date.now()-s.startedAt)/1000)):s.seconds;document.getElementById('clock').textContent='Q'+s.period+' '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}catch(e){}}setInterval(draw,250);draw()</script></body></html>
