<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Planner · Larson Live Stats</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#0b1423;color:#f0f5fc}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 16px 80px}a{color:#eac572}section{border:1px solid #354863;background:#17263b;border-radius:15px;padding:18px;margin:16px 0}h1{margin:23px 0 4px}p,small{color:#b9c9de}label{display:block;margin:10px 0 5px;font-weight:650}input,select{width:100%;padding:12px;background:#0b182a;border:1px solid #586d88;color:white;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;border:0;border-radius:9px;background:#e8bd5a;color:#17233a;padding:12px 16px;font-weight:750;cursor:pointer}.secondary{background:#354c69;color:white}.game{border-top:1px solid #354863;padding:16px 0}.game:first-child{border-top:0}.game strong{display:block;font-size:18px;margin:5px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.status{color:#f3ce86}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e8bd5a;outline-offset:2px}@media(max-width:470px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="home.html">← Multisport home</a><h1>Schedule Planner</h1><p>Plan upcoming matchups in this browser. This preview is not a shared league schedule and does not create cloud game records.</p><section><h2>Add a game</h2><form id="form"><div class="grid"><div><label for="sport">Sport</label><select id="sport"><option value="basketball">Basketball</option><option value="soccer">Soccer</option><option value="volleyball">Volleyball Beta</option><option value="baseball">Baseball (planning only)</option><option value="softball">Softball (planning only)</option><option value="football">Football (planning only)</option><option value="flag-football">Flag football (planning only)</option></select></div><div><label for="level">Level</label><input id="level" placeholder="Varsity" maxlength="40"></div><div><label for="home">Home team</label><input id="home" required maxlength="60"></div><div><label for="away">Away team</label><input id="away" required maxlength="60"></div><div><label for="date">Date and time</label><input id="date" type="datetime-local" required></div><div><label for="venue">Venue (optional)</label><input id="venue" maxlength="100"></div></div><button type="submit" style="margin-top:16px">Save scheduled game</button></form><p id="message" role="status" class="status"></p></section><section><h2>Upcoming and saved games</h2><div id="games"></div></section><script src="shared/game-identity.cjs"></script><script>(function(){'use strict';const key='lls-schedule-drafts-v1',el=id=>document.getElementById(id);let games=[];try{const value=JSON.parse(localStorage.getItem(key));if(Array.isArray(value))games=value.filter(g=>g&&typeof g==='object').slice(0,500);}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(games));return true;}catch(e){el('message').textContent='Unable to save in this browser.';return false;}}function render(){const target=el('games');target.replaceChildren();if(!games.length){const p=document.createElement('p');p.textContent='No scheduled games in this browser yet.';target.append(p);return;}games.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(g=>{const div=document.createElement('div');div.className='game';const sport=document.createElement('small');sport.textContent=g.sport.toUpperCase()+' · '+(g.level||'Unspecified level');const name=document.createElement('strong');name.textContent=g.home+' vs. '+g.away;const details=document.createElement('small');const d=new Date(g.date);details.textContent=(Number.isNaN(d.getTime())?g.date:d.toLocaleString())+(g.venue?' · '+g.venue:'');const actions=document.createElement('div');actions.className='actions';if(['basketball','soccer','volleyball'].includes(g.sport)){const start=document.createElement('button');start.textContent='Open scorer';start.addEventListener('click',()=>{if(g.sport==='volleyball'){const q=new URLSearchParams({home:g.home,away:g.away});location.href='volleyball.html?'+q;}else location.href=g.sport==='soccer'?'soccer.html':'index.html';});actions.append(start);}const remove=document.createElement('button');remove.className='secondary';remove.textContent='Delete draft';remove.addEventListener('click',()=>{if(!confirm('Delete this scheduled game draft?'))return;games=games.filter(x=>x.id!==g.id);save();render();});actions.append(remove);div.append(sport,name,details,actions);target.append(div);});}el('form').addEventListener('submit',e=>{e.preventDefault();const g={id:String(Date.now())+'-'+Math.random().toString(36).slice(2),sport:el('sport').value,level:el('level').value.trim(),home:el('home').value.trim(),away:el('away').value.trim(),date:el('date').value,venue:el('venue').value.trim()};if(!g.home||!g.away||!g.date)return;if(games.length>=500){el('message').textContent='Draft limit reached; remove older games.';return;}const matches=window.LarsonGameIdentity?.candidates(g,games)||[];if(matches.length){const summary=matches.map(x=>x.status==='possible-match'?'similar matchup':'possible conflict').join(', ');if(!confirm('A '+summary+' already exists in this browser. Save another scheduled game anyway?')){el('message').textContent='Duplicate review: no new game created.';return;}}games.push(g);if(save()){el('form').reset();el('message').textContent='Scheduled game saved on this device.';render();}});render();})();</script></main></body></html>
