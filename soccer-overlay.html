<!doctype html><html><head><meta charset="utf-8"><style>html,body{background:transparent;margin:0;font:800 27px system-ui;color:white}#bug{position:absolute;bottom:40px;left:35px;display:flex;border-radius:9px;overflow:hidden;background:#172941ee}span{padding:12px 17px}#clock{background:#9e2849}#status{position:absolute;bottom:12px;left:35px;font:12px system-ui;color:#ffdf90}</style></head><body><div id="bug"><span id="away">VISITOR</span><span id="as">0</span><span id="clock">H1 00:00</span><span id="hs">0</span><span id="home">HOME</span></div><div id="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script><script src="live.js"></script><script>const p=new URLSearchParams(location.search),id=(p.get('game')||'').toUpperCase();let s=null;const $=x=>document.getElementById(x);function draw(){if(!s)return;for(const t of ['home','away'])$(t).textContent=s[t];$('hs').textContent=s.scores.home;$('as').textContent=s.scores.away;let n=s.seconds+(s.running?Math.max(0,Math.floor((Date.now()-s.startedAt)/1000)):0);$('clock').textContent='H'+s.period+' '+String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}if(p.get('local')==='1'){setInterval(()=>{try{const x=JSON.parse(localStorage.getItem('lls-soccer-v01'));if(x)s={...x,scores:{home:x.events.filter(e=>e.team==='home'&&e.kind==='Goal').length,away:x.events.filter(e=>e.team==='away'&&e.kind==='Goal').length}};draw()}catch(e){}},1000)}else if(/^[A-Z0-9]{6}$/.test(id)){Live.watch(id,row=>{if(row){s=Live.publicState(row);draw()}},message=>$('status').textContent=message.startsWith('Live')?'':message)}else $('status').textContent='Missing game code';setInterval(draw,250);</script></body></html>
