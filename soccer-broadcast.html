<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Larson Live Stats · Soccer Broadcast</title><style>:root{font:16px system-ui;background:#101827;color:#f4f7ff}*{box-sizing:border-box}body{margin:0}main{max-width:1300px;margin:auto;padding:15px}h1{font-size:22px}h2{font-size:17px;margin:0 0 12px}header{display:flex;justify-content:space-between;gap:10px;align-items:center}.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.team{border-top:7px solid var(--color);background:#20334f;border-radius:12px;text-align:center;padding:20px 10px}.team strong{font-size:clamp(42px,7vw,90px);display:block}.middle{text-align:center;font-size:22px;font-weight:800}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:15px;margin-top:15px}.card{background:#1c2b42;padding:16px;border-radius:12px;margin-bottom:15px}.stat{display:grid;grid-template-columns:1fr 1.4fr 1fr;text-align:center;padding:10px;border-bottom:1px solid #3c506e}.stat b{font-variant-numeric:tabular-nums}.timeline article{padding:10px;border-bottom:1px solid #3c506e}.muted{color:#b5c4d9;font-size:13px}.playerTable{width:100%;border-collapse:collapse;font-size:13px}.playerTable th,.playerTable td{padding:8px;text-align:left;border-bottom:1px solid #3c506e}.playerTable td:not(:first-child){text-align:right}.playerTable th:not(:first-child){text-align:right}.strip{border-left:5px solid var(--color);padding-left:10px}@media(max-width:720px){.grid{grid-template-columns:1fr}.team{padding:10px 4px}.middle{font-size:16px}.board{gap:5px}}</style><link rel="stylesheet" href="soccer-broadcast.css"></head><body><main><header><h1><span class="brandMark">Z</span>Larson Live Stats · Soccer</h1><span id="status" class="muted">Connecting…</span></header><div class="board"><div class="team" id="homeTile"><div class="logoSlot" id="homeLogoSlot">H</div><span id="homeName">HOME</span><strong id="homeScore">0</strong></div><div class="middle"><div id="clock">00:00</div><div id="period">First half</div></div><div class="team" id="awayTile"><div class="logoSlot" id="awayLogoSlot">V</div><span id="awayName">VISITOR</span><strong id="awayScore">0</strong></div></div><div class="grid"><div><section class="card"><h2>Team comparison</h2><div id="stats"></div></section><section class="card"><h2>Player statistics</h2><div id="players"></div></section></div><section class="card"><h2>Game flow</h2><div id="timeline" class="timeline"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script><script src="live.js"></script><script src="soccer-brand.js"></script><script src="soccer-clock.js"></script><script>
const p=new URLSearchParams(location.search),id=(p.get('game')||'').trim().toUpperCase(),local=p.get('local')==='1';let s=null;const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};const events=()=>s?.events||[];const count=(t,fn)=>events().filter(e=>e.team===t&&fn(e)).length;
function render(){if(!s)return;for(const t of ['home','away'])SoccerBrand.logo(t+'LogoSlot',s[t],s.logos?.[t]);for(const t of ['home','away']){$(t+'Name').textContent=s[t];const nicknameEl=$(t+'Nickname');if(nicknameEl)nicknameEl.textContent=s.teamBrands?.[t]?.nickname||'';$(t+'Score').textContent=count(t,e=>e.kind==='Goal');$(t+'Tile').style.setProperty('--color',s.teamBrands?.[t]?.scheme?.accent||s.colors?.[t]||'#57799c')}$('period').textContent=s.finished?'Final':s.period===2?'Second half':'First half';const defs=[['Goals',e=>e.kind==='Goal'],['Shots on goal',e=>e.kind==='Goal'||e.kind==='Shot on goal'],['Shots off target',e=>e.kind==='Shot off target'],['Saves',e=>e.kind==='Save'],['Corners',e=>e.kind==='Corner'],['Fouls',e=>e.kind==='Foul'],['Yellow cards',e=>e.kind==='Yellow card'],['Red cards',e=>e.kind==='Red card'],['Offsides',e=>e.kind==='Offside']];if(s.trackCrosses||s.trackedStats?.includes('Cross'))defs.push(['Crosses',e=>e.kind==='Cross']);if(s.trackedStats?.includes('Free kick'))defs.push(['Free kicks',e=>e.kind==='Free kick']);if(s.trackedStats?.includes('Team save'))defs.push(['Team saves',e=>e.kind==='Team save']);$('stats').innerHTML=defs.map(([label,fn])=>'<div class="stat"><b>'+count('home',fn)+'</b><span>'+label+'</span><b>'+count('away',fn)+'</b></div>').join('');$('timeline').innerHTML=events().slice().reverse().map(e=>'<article><b>H'+e.period+' '+SoccerClock.timeLabel(e,fmt)+'</b> · '+esc(s[e.team])+' · '+esc(e.kind)+(e.player?' · '+esc(e.player):'')+(e.assist?' · Assist: '+esc(e.assist):'')+'</article>').join('')||'<p class="muted">No events yet</p>';let tables='';for(const t of ['home','away']){const roster=s.rosters?.[t]||[];const names=[...new Set([...roster,...events().filter(e=>e.team===t).flatMap(e=>[e.player,e.assist]).filter(Boolean)])];tables+='<h3 class="strip" style="--color:'+esc(s.colors?.[t]||'#57799c')+'">'+esc(s[t])+'</h3><table class="playerTable"><thead><tr><th>Player</th><th>G</th><th>A</th><th>SOG</th><th>SV</th><th>YC</th></tr></thead><tbody>'+names.map(n=>'<tr><td>'+esc(n)+'</td><td>'+count(t,e=>e.kind==='Goal'&&e.player===n)+'</td><td>'+count(t,e=>e.kind==='Goal'&&e.assist===n)+'</td><td>'+count(t,e=>(e.kind==='Goal'||e.kind==='Shot on goal')&&e.player===n)+'</td><td>'+count(t,e=>e.kind==='Save'&&e.player===n)+'</td><td>'+count(t,e=>e.kind==='Yellow card'&&e.player===n)+'</td></tr>').join('')+'</tbody></table>'}$('players').innerHTML=tables;}
function tick(){if(!s)return;const n=SoccerClock.seconds(s);$('clock').textContent=fmt(n)}
async function refresh(){try{if(local){s=JSON.parse(localStorage.getItem('lls-soccer-v01'));$('status').textContent='Local browser preview'}else{if(!/^[A-Z0-9]{6}$/.test(id))throw Error('Add ?game=ABC123');const row=await Live.read(Live.client,'live_games',id);if(!row?.state||row.state.sport!=='soccer')throw Error('Private match statistics require scorer sign-in');s=row.state;$('status').textContent='Scorer broadcast · live'}render();tick()}catch(e){$('status').textContent=e.message}}
setInterval(refresh,3000);setInterval(tick,250);refresh();
</script></body></html>
