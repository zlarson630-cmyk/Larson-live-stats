<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="referrer" content="no-referrer">
 <title>Tag Team · Larson Live Stats</title>
 <link rel="icon" href="assets/brand/larson-z-mark.svg">
 <link rel="stylesheet" href="basketball-tag-team.css?v=1">
 <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
 <script defer src="live.js"></script>
 <script defer src="basketball-report.js"></script>
 <script defer src="basketball-tag-team.js?v=1"></script>
</head>
<body>
 <header>
  <img src="assets/brand/larson-z-mark.svg" alt="">
  <div><p>Larson Live Stats</p><h1 id="tag-title">Tag Team</h1></div>
  <p id="tag-matchup"></p>
 </header>
 <main>
  <p id="tag-status" role="status">Connecting to the game…</p>
  <div id="tag-workspace" hidden>
   <section aria-labelledby="tag-shots-title" class="tag-shots">
    <div class="tag-list-heading"><h2 id="tag-shots-title">Shots</h2><span id="tag-count"></span></div>
    <ul id="tag-list"></ul>
   </section>
   <section aria-labelledby="tag-selection" class="tag-entry">
    <h2 id="tag-selection">Select a shot</h2>
    <p id="tag-instructions"></p>
    <div id="tag-chart" hidden>
     <svg id="tag-court" viewBox="-0.5 -0.5 51 48" tabindex="0" aria-label="Half court" aria-describedby="tag-instructions">
      <g id="tag-court-lines"></g>
      <g id="tag-marks"></g>
      <circle id="tag-cursor" r="1" visibility="hidden"></circle>
     </svg>
    </div>
    <div id="tag-detail" hidden></div>
    <p id="tag-feedback" role="status"></p>
   </section>
  </div>
 </main>
</body>
</html>
